<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtrar imagen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header id="main-header">
        <h1>Categorías de Turismo disponibles: </h1>
    </header>


    <main>
<!-- SECCIÓN DE MI CATEGÓRIA-->
        <section id="categorias">
            <ul class="lista-categorias">
                <li data-category="sunny">Turismo de sol y playa</li>
                <li data-category="culture">Turismo cultural</li>
                <li data-category="religion">Turismo religioso</li>
                <li data-category="dark">Turismo oscuro</li>
            </ul>
        </section>
         

<!-- SECCIÓN DE MI GALERÍA DE IMÁGENES-->
        <section id="galeria" class="hidden"> <!-- EL ESTADO INICIAL DE MI APLICACIÓN ES HIDDEN-->
            <div class="visor-principal">
                <img src="" id="imagen-grande" alt="Imagen seleccionada">
            </div>
            <div id="imagenes-miniaturas" class="miniaturas">
                <!-- LAS IMÁGENES PEQUEÑAS SE CARGARÁN AQUÍ CON JS -->
            </div>
        </section>
    </main>
   
    <footer>
        <p>Copyright 2026 - Mi Página Web.</p>
    </footer> 

    <script src="js/main.js"></script> 
</body>
</html>
